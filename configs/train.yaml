experiment_name: mvip_paper_seed42
seed: 42

vlm:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  init_mode: text
  init_soft_prompt_text: Describe objects, actions, camera motion, and temporal changes.
  n_soft_tokens: 16
  caption_temperature: 0.8
  max_new_tokens: 256
  num_caption_frames: 8

generator:
  conditioning: first_last
  num_frames: 81
  match_reference_num_frames: true
  max_seconds: 5.0
  max_num_frames: 121
  cpu_offload: false

optimization:
  n_best_of: 4
  outer_steps: 100
  inner_steps: 1
  inner_lr: 0.001
  epsilon: 0.1
  tasks_per_outer_step: 1
  support_size: 1
  save_candidate_videos: false

data:
  min_frames_per_clip: 4
  task_manifest: manifests/train_samples.json
  schedule_manifest: manifests/train_schedule.json

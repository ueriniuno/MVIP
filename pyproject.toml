[build-system]
requires = ["setuptools>=69,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvip"
version = "0.1.0"
description = "Meta Inverse Prompting for Video Generative Models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate==1.14.0",
  "diffusers==0.35.1",
  "dreamsim==0.2.1",
  "einops==0.8.2",
  "ftfy==6.1.1",
  "imageio==2.37.3",
  "imageio-ffmpeg==0.6.0",
  "numpy==1.26.4",
  "open-clip-torch==3.3.0",
  "omegaconf==2.3.1",
  "opencv-python-headless==4.11.0.86",
  "peft==0.19.1",
  "Pillow==12.0.0",
  "PyYAML==6.0.3",
  "safetensors==0.8.0",
  "scipy==1.15.3",
  "sentencepiece==0.2.1",
  "timm==1.0.30",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.54.1",
  "tqdm>=4.66,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "mvip*",
]
namespaces = true
